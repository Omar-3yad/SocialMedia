<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>روابط عمر أياد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
  /* Concept: one dark stage. A floating 3D mark lit from behind, five glass cards that tilt toward the pointer. */
  :root {
    color-scheme: dark;
    --bg: #111216;
    --panel: #181a1f;
    --line: rgba(245, 244, 239, 0.1);
    --line-strong: rgba(255, 118, 92, 0.55);
    --fg: #f5f4ef;
    --muted: #a8a8a3;
    --faint: #8e8e89;
    --coral: #ff765c;
    --coral-glow: rgba(255, 118, 92, 0.38);

    --f-kufi: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
    --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
    --f-latin: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;

    --logo: clamp(300px, 88vw, 440px);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* Ambient light: a coral wash behind the mark and a soft vignette. No patterns. */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 38% at 50% 22%, rgba(255, 118, 92, 0.17), transparent 70%),
      radial-gradient(90% 60% at 50% 110%, rgba(255, 118, 92, 0.07), transparent 70%),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
    margin-inline: auto;
    min-height: calc(100dvh - 48px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }

  /* ---------- Language switch ---------- */
  /* Sits above the hero: the logo box is pulled up with a negative margin and must never cover these buttons. */
  .bar { position: relative; z-index: 3; display: flex; justify-content: flex-end; }

  .lang {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(24, 26, 31, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .lang button {
    appearance: none;
    border: 0;
    margin: 0;
    min-width: 48px;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: var(--f-latin);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }

  .lang button:hover { color: var(--fg); }

  .lang button[aria-pressed="true"] {
    background: var(--coral);
    color: var(--bg);
  }

  /* ---------- Hero ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }

  .logo {
    position: relative;
    width: var(--logo);
    max-width: 100%;
    aspect-ratio: 1;
    /* The artwork has transparent padding; pull the neighbours in without touching the image. */
    margin-block: calc(var(--logo) * -0.12) calc(var(--logo) * -0.17);
    perspective: 900px;
    pointer-events: none;
  }

  .glow {
    position: absolute;
    inset: 18% 16% 22%;
    background: radial-gradient(closest-side, var(--coral-glow), transparent);
    filter: blur(28px);
    opacity: 0.8;
  }

  .floor {
    position: absolute;
    left: 50%;
    bottom: 19%;
    width: 48%;
    height: 5%;
    translate: -50% 0;
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.7), transparent);
    filter: blur(6px);
    animation: shadow 7s ease-in-out infinite;
  }

  .logo-float { position: absolute; inset: 0; animation: float 7s ease-in-out infinite; }

  .logo-tilt {
    position: absolute;
    inset: 0;
    transform: rotateY(var(--lx, 0deg)) rotateX(var(--ly, 0deg));
    transition: transform 0.45s var(--ease);
  }

  .logo-tilt img {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 26px 34px rgba(255, 118, 92, 0.24)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    animation: rise-in 0.8s var(--ease) backwards;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }

  @keyframes shadow {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(0.86); opacity: 0.6; }
  }

  @keyframes rise-in {
    from { transform: translateY(18px) scale(0.96); }
  }

  .name {
    margin: 0;
    font-weight: 700;
    line-height: 1.2;
    color: var(--fg);
    text-wrap: balance;
  }

  html[lang="ar"] .name { font-family: var(--f-kufi); font-size: clamp(40px, 11.5vw, 60px); }
  html[lang="en"] .name { font-family: var(--f-latin); font-size: clamp(38px, 10.5vw, 56px); letter-spacing: 0.04em; }

  .tagline {
    margin: 0;
    max-width: 30ch;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
    text-wrap: balance;
  }

  /* ---------- Links ---------- */
  main { margin-top: 18px; }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .links li { animation: rise 0.6s var(--ease) backwards; animation-delay: calc(0.12s + var(--i, 0) * 0.07s); }

  @keyframes rise {
    from { transform: translateY(14px); }
  }

  .card {
    --mx: 50%;
    --my: 50%;
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 68px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(150deg, rgba(245, 244, 239, 0.065), rgba(245, 244, 239, 0.015));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--fg);
    text-decoration: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.07),
      0 1px 1px rgba(0, 0, 0, 0.5),
      0 10px 22px -8px rgba(0, 0, 0, 0.7),
      0 24px 40px -22px rgba(0, 0, 0, 0.8);
    transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));
    transition: transform 0.28s var(--ease), border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }

  /* Light that follows the pointer along the card surface */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(260px circle at var(--mx) var(--my), rgba(255, 118, 92, 0.2), transparent 65%);
    opacity: 0;
    transition: opacity 0.25s var(--ease);
    pointer-events: none;
  }

  .card:hover,
  .card:focus-visible {
    --lift: -3px;
    border-color: var(--line-strong);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.1),
      0 1px 1px rgba(0, 0, 0, 0.5),
      0 16px 28px -8px rgba(0, 0, 0, 0.75),
      0 28px 46px -20px rgba(255, 118, 92, 0.32);
  }

  .card:hover::before,
  .card:focus-visible::before { opacity: 1; }

  .card:active { --lift: 0px; transform: perspective(800px) scale(0.985); }

  .card:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

  .tile {
    position: relative;
    flex: none;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(255, 118, 92, 0.22), rgba(255, 118, 92, 0.07));
    border: 1px solid rgba(255, 118, 92, 0.28);
    color: #ffb4a4;
  }

  .tile svg { display: block; width: 18px; height: 18px; }

  .text { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }

  .label {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-family: var(--f-latin);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .note { color: var(--muted); font-size: 14px; line-height: 1.5; }

  .temp {
    padding: 1px 9px;
    border: 1px solid rgba(255, 118, 92, 0.45);
    border-radius: 999px;
    color: var(--coral);
    font-family: var(--f-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.6;
  }

  .arrow {
    position: relative;
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--faint);
    transition: transform 0.25s var(--ease), color 0.25s var(--ease);
  }

  html[dir="rtl"] .arrow { scale: -1 1; }

  .card:hover .arrow,
  .card:focus-visible .arrow { color: var(--coral); transform: translateX(3px); }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: auto;
    padding-top: 32px;
    text-align: center;
    color: var(--faint);
    font-size: 14px;
  }

  @media (min-width: 720px) {
    body { padding-block: 28px 36px; }
    .tile svg { width: 20px; height: 20px; }
    .tile { width: 46px; height: 46px; }
    .card { padding: 14px 20px; min-height: 76px; }
    .label { font-size: 20px; }
    .tagline { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-float, .floor, .logo-tilt img, .links li { animation: none; }
    .logo-tilt, .card, .arrow, .card::before, .lang button { transition: none; }
    .card:hover, .card:focus-visible { --lift: 0px; }
    .card:hover .arrow, .card:focus-visible .arrow { transform: none; }
  }
</style>

<script>
  /* Set language and direction before first paint so Arabic never flashes as LTR. */
  (function () {
    var l = 'ar';
    try { var s = localStorage.getItem('oa-lang'); if (s === 'ar' || s === 'en') l = s; } catch (e) {}
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

    </nav>
  </main>

  <footer id="foot"></footer>
</div>

<script>
  /* ====================================================================
     EDIT HERE. Names, texts and links all live in this one block.
     - url: the real address. Leave it empty ("") to hide that platform.
     - temporary: true shows a small "temporary" tag on the card.
       Set it to false when you put in the real link.
     ==================================================================== */
  var NAME = { ar: 'عمر أياد', en: 'Omar Ayad' };

  var TEXT = {
    ar: {
      title: 'روابط عمر أياد',
      tagline: 'اكتشف منصاتي وتابعني من أي مكان.',
      logoAlt: 'شعار عمر أياد',
      navLabel: 'روابط المنصات',
      temp: 'مؤقت',
      newTab: '(يفتح في تبويب جديد)'
    },
    en: {
      title: 'Omar Ayad Links',
      tagline: 'Explore my platforms and follow along.',
      logoAlt: 'Omar Ayad logo',
      navLabel: 'Platform links',
      temp: 'Temporary',
      newTab: '(opens in a new tab)'
    }
  };

  var LINKS = [
    { id: 'kick',      label: 'Kick',      url: 'https://kick.com/omarayad3',              temporary: false, note: { ar: 'البث المباشر',     en: 'Live streams' } },
    { id: 'youtube',   label: 'YouTube',   url: 'https://youtube.com/@3m.929?si=4F1NUnUa7-FFxIlV',       temporary: false, note: { ar: 'الفيديوهات',      en: 'Videos' } },
    { id: 'discord',   label: 'Discord',   url: 'https://discord.gg/upEztmcyeY',           temporary: false, note: { ar: 'انضم إلى السيرفر', en: 'Join the server' } },
    { id: 'tiktok',    label: 'TikTok',    url: 'https://www.tiktok.com/@ex.gaming9?_r=1&_t=ZS-9AzhGT9jIVs',        temporary: false, note: { ar: 'المقاطع القصيرة',  en: 'Short clips' } },
    { id: 'instagram', label: 'Instagram', url: 'https://www.instagram.com/jtltg?rpxt=MTFpNG96Z3VvZzJkbQ==',     temporary: false, note: { ar: 'الصور واللحظات',   en: 'Photos and stories' } }
  ];

  /* ==================== end of editable block ==================== */

  var ICONS = {
    kick: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h5.2v6.1L13.6 3H20l-7.1 8L20.4 21h-6.3l-5.9-7.4V21H3z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.2" y="5" width="19.6" height="14" rx="4.2" fill="currentColor"/><path d="M10 9.2v5.6l5-2.8z" fill="#181a1f"/></svg>',
    discord: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.2 4.6c-1.3.2-2.5.6-3.6 1.1C2.4 9 1.8 12.200 2.100 15.400c1.400 1.100 3 1.800 4.700 2.200l1-1.700c-.5-.2-1-.4-1.400-.8l.3-.3c2.700 1.300 5.600 1.300 8.300 0l.3.3c-.4.400-.9.600-1.400.8l1 1.700c1.700-.4 3.300-1.100 4.700-2.200.4-3.700-.6-6.900-2.500-9.700-1.100-.5-2.300-.9-3.600-1.100l-.5 1c-1.100-.2-2.100-.2-3.200 0z"/><circle cx="9" cy="12.400" r="1.500" fill="#181a1f"/><circle cx="15" cy="12.400" r="1.500" fill="#181a1f"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.800 3v11.300a3.600 3.600 0 1 1-3.600-3.600"/><path d="M13.800 3c.3 2.600 2.100 4.400 5 4.700"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.500" y="3.500" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.900"/><circle cx="17.100" cy="6.900" r="0.600" fill="currentColor"/></svg>'
  };

  var ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  var root = document.documentElement;
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function validUrl(u) {
    if (!u) return false;
    try { var p = new URL(u); return p.protocol === 'https:' || p.protocol === 'http:'; } catch (e) { return false; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function bindCard(el) {
    if (!fine) return;
    el.addEventListener('pointermove', function (e) {
      if (reduce.matches) return;
      var r = el.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width;
      var y = (e.clientY - r.top) / r.height;
      el.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      el.style.setProperty('--rx', ((0.5 - y) * 5).toFixed(2) + 'deg');
      el.style.setProperty('--ry', ((x - 0.5) * 7).toFixed(2) + 'deg');
    });
    el.addEventListener('pointerleave', function () {
      el.style.removeProperty('--rx');
      el.style.removeProperty('--ry');
    });
  }

  function renderLinks(lang) {
    var t = TEXT[lang];
    var html = '';
    var n = 0;
    LINKS.forEach(function (l) {
      if (!validUrl(l.url)) return;
      var note = l.note && l.note[lang] ? '<span class="note">' + esc(l.note[lang]) + '</span>' : '';
      var tag = l.temporary ? '<span class="temp">' + esc(t.temp) + '</span>' : '';
      html += '<li style="--i:' + n + '"><a class="card" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="tile">' + (ICONS[l.id] || '') + '</span>' +
        '<span class="text"><span class="label"><span dir="ltr">' + esc(l.label) + '</span>' + tag + '</span>' + note + '</span>' +
        ARROW + '<span class="sr">' + esc(t.newTab) + '</span></a></li>';
      n++;
    });
    var ul = document.getElementById('links');
    ul.innerHTML = html;
    Array.prototype.forEach.call(ul.querySelectorAll('.card'), bindCard);
  }

  function apply(lang, persist) {
    var t = TEXT[lang];
    root.lang = lang;
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title;
    document.getElementById('name').textContent = NAME[lang];
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('logo-img').alt = t.logoAlt;
    document.getElementById('nav').setAttribute('aria-label', t.navLabel);
    document.getElementById('foot').textContent = '© ' + new Date().getFullYear() + ' ' + NAME[lang];
    ['ar', 'en'].forEach(function (k) {
      document.getElementById('btn-' + k).setAttribute('aria-pressed', k === lang ? 'true' : 'false');
    });
    renderLinks(lang);
    if (persist) { try { localStorage.setItem('oa-lang', lang); } catch (e) {} }
  }

  document.getElementById('lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) apply(b.getAttribute('data-lang'), true);
  });

  /* Mark tilts slightly toward the pointer on desktop. */
  if (fine) {
    var tilt = document.getElementById('tilt');
    var raf = 0, px = 0, py = 0;
    window.addEventListener('pointermove', function (e) {
      if (reduce.matches) return;
      px = e.clientX / window.innerWidth - 0.5;
      py = e.clientY / window.innerHeight - 0.5;
      if (!raf) raf = requestAnimationFrame(function () {
        raf = 0;
        tilt.style.setProperty('--lx', (px * 16).toFixed(2) + 'deg');
        tilt.style.setProperty('--ly', (-py * 10).toFixed(2) + 'deg');
      });
    });
  }

  apply(root.lang === 'en' ? 'en' : 'ar', false);
</script>

</body></html>
